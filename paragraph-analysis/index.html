<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flextext Paragraph Analysis</title>
<meta name="description" content="Group the lines of an interlinear text into phrases, clauses, sentences, and paragraphs — semantic structure analysis over a .fxpa or .flextext file. Works offline.">
<meta name="theme-color" content="#5b3a9b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/paragraph.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/paragraph-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flextext Paragraph Analysis">
<!-- Shared engine + styles live in the Flextext Editor's docs/ (same origin — on this
     Cloudflare site build.sh copies ../docs to /flextext-editor/, so the engine ships in the
     SAME atomic deployment as this shell; on the local dev rig dev-serve.sh maps both paths).
     All paragraph logic is maintained ONCE, in the editor repo's js/. -->
<link rel="stylesheet" href="/flextext-editor/css/app.css">
<!-- Selects paragraph-analysis mode in the shared engine. Classic inline script so it
     runs before the deferred module executes. -->
<script>window.__MODE = 'paragraph';</script>
</head>
<body>

<main id="pa-main">
<!-- The paragraph app renders everything here (shared js/app.js → initParagraphApp). -->
</main>

<div id="toast" hidden></div>

<!-- Shared app engine loads from the editor copy (same origin). -->
<script type="module" src="/flextext-editor/js/app.js"></script>
</body>
</html>
