# Raise / clear the researcher-panel MAINTENANCE NOTICE — a one-button version of the D1 statement,
# so nobody has to remember it or dig it out of a chat log at the moment they need it.
#
# What it does: sets or clears the `maintenance` row in the `ops_flag` table (worker/migrate-ops-flag.sql).
# Since v715 all three lines of the banner are the operator's (Seth, 2026-10-10): `title`, `message` and
# `advice` are pre-filled with the defaults and can be edited or blanked. Left at the defaults, the message
# is stored as plain text and behaves exactly as it always did.
# The worker returns it on GET /v1/researcher, which the researcher dashboard already polls every 12s,
# so the banner appears and disappears within one tick. No deploy, no release.
#
# ⚠ RESEARCHER PANEL ONLY. This cannot reach a field device: the banner is rendered in
# researcher-panel.js and test/maintenance-notice.test.mjs fails the build if app.js — the editor,
# recorder and crowd engine — ever learns to render it. Raising this notice never stops anyone
# transcribing offline.
#
# Cost: free. Public repo, standard ubuntu-latest runner.
name: Maintenance notice
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: status
        options: [status, raise, clear]
      # ⚠ ALL THREE LINES OF THE BANNER ARE YOURS (Seth, 2026-10-10: "the heading and the 'please avoid…'
      # footer should be text specified in the workflow … default, but customizable"). Each field is
      # pre-filled with the default; edit it, or blank it to drop that line. While title and advice are
      # still exactly the defaults the message is stored as PLAIN TEXT, which every panel version shows
      # under its own (localised) heading and advice — byte-identical to before. Change either and the
      # three are stored as JSON, which needs the live panel at v715 or later: the guard step below reads
      # the live panel's version and refuses rather than let an older panel print a JSON blob.
      # ⚠ A field submitted EMPTY gets its default back (GitHub fills a blank dispatch input from
      # `default:`), so "blank = none" cannot work. A lone `-` means none.
      title:
        description: "Heading (raise only). Type - for no heading."
        required: false
        type: string
        default: "Maintenance in progress"
      message:
        description: "Message (raise only)"
        required: false
        type: string
        default: "Backend maintenance is in progress. You may see an outage or a glitch."
      advice:
        description: "Last line (raise only). Type - for no last line."
        required: false
        type: string
        default: "Please avoid making changes in the researcher panel until this notice disappears. Your devices and their texts are unaffected."
      details:
        description: "More info (raise only, optional): a longer explanation shown collapsed under a 'More info' toggle. Use \\n for a line break."
        required: false
        type: string
jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compose the SQL in a FILE rather than interpolating into the shell command.
      # ⚠ Not only for injection safety: an apostrophe in the message — "Seth's maintenance", or any
      # ordinary English possessive — would terminate the SQL string literal early and either fail
      # the run or store a truncated notice. Doubling quotes is the SQL-standard escape, and doing it
      # in node keeps the message out of shell word-splitting entirely.
      - name: Compose the statement
        id: compose
        env:
          FX_ACTION: ${{ inputs.action }}
          FX_TITLE: ${{ inputs.title }}
          FX_MSG: ${{ inputs.message }}
          FX_ADVICE: ${{ inputs.advice }}
          FX_DETAILS: ${{ inputs.details }}
        run: |
          node -e '
            const act = process.env.FX_ACTION || "status";
            /* The same words as the panel (i18n panel.maint.title / .advice, English), so "left as it was"
             * is detectable: test/maintenance-notice.test.mjs pins the two to i18n.js. */
            const DEFAULT_TITLE = "Maintenance in progress";
            const DEFAULT_ADVICE = "Please avoid making changes in the researcher panel until this notice disappears. Your devices and their texts are unaffected.";
            const DEFAULT_MSG = "Backend maintenance is in progress. You may see an outage or a glitch.";
            // A lone "-" means NONE: GitHub refills an empty dispatch field from its default, so an
            // operator cannot submit a blank one (the v715 notice went out with the advice it had
            // asked to drop). Both lines are stored as "" and the panel omits them.
            const none = (s) => (s === "-" ? "" : s);
            const title = none((process.env.FX_TITLE || "").trim());
            const advice = none((process.env.FX_ADVICE || "").trim());
            const msg = (process.env.FX_MSG || "").trim() || DEFAULT_MSG;
            // A dispatch field is one line; \\n typed into it becomes a real line break in the collapsed text.
            const details = (process.env.FX_DETAILS || "").replace(/\\n/g, "\n").trim();
            /* Plain text while the heading and the last line are the defaults: every panel version shows
             * that under its own localised lines. Otherwise JSON, which the panel (researcher-panel.js
             * opsNotice) reads as { title, message, advice } — a key present but empty means "no such
             * line". A plain message that merely BEGINS with "{" is padded so it cannot pass for JSON. */
            const custom = title !== DEFAULT_TITLE || advice !== DEFAULT_ADVICE || !!details;
            const value = custom
              ? JSON.stringify({ kind: "maintenance", title, message: msg, advice, ...(details ? { details } : {}) })
              : (msg[0] === "{" ? " " + msg : msg);
            const q = (s) => "\x27" + String(s).replace(/\x27/g, "\x27\x27") + "\x27";
            const sql = act === "raise"
              ? `INSERT OR REPLACE INTO ops_flag (key,value,updated_at) VALUES (${q("maintenance")},${q(value)},strftime(${q("%s")},${q("now")})*1000);`
              : act === "clear"
              ? `DELETE FROM ops_flag WHERE key=${q("maintenance")};`
              : `SELECT key, value, updated_at FROM ops_flag WHERE key=${q("maintenance")};`;
            require("fs").writeFileSync("/tmp/ops-flag.sql", sql + "\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "structured=" + (act === "raise" && custom ? "1" : "0") + "\n");
            console.log("action:", act, "| custom heading/advice:", custom, "| value length:", value.length);
            console.log(sql);
          '

      # ⚠ A STRUCTURED NOTICE ON A PANEL THAT CANNOT READ IT IS WORSE THAN NO NOTICE: v714 and earlier
      # print the value verbatim, so researchers would see a JSON blob under "Maintenance in progress".
      # The live panel version is one GET away (its sw.js, served with no-store and CORS *), so read it
      # and refuse. The legacy GitHub Pages panel is not checked: it stopped receiving updates at v432,
      # carries a deprecation banner, and would otherwise block this for ever.
      - name: "Refuse a custom heading or advice the live panel cannot read"
        if: steps.compose.outputs.structured == '1'
        run: |
          set -euo pipefail
          live=$(curl -fsS --max-time 20 https://research.flextext.app/sw.js | grep -oE "const VERSION = 'v[0-9]+'" | grep -oE '[0-9]+' | head -1 || true)
          echo "live researcher panel: v${live:-?}"
          if [ -z "$live" ] || [ "$live" -lt 715 ]; then
            echo "::error::The live researcher panel is v${live:-unknown}; a custom heading, last line or More-info text needs v715 or later (it is stored as JSON, which an older panel prints raw). Release the panel first, or leave those two fields at their defaults."
            exit 1
          fi

      - name: "Apply to the LIVE database"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx --yes wrangler@4 d1 execute flextext-connectivity --remote --file /tmp/ops-flag.sql

      - name: What happens next
        run: |
          case "${{ inputs.action }}" in
            raise) echo "::notice::Notice RAISED. Researchers see it within ~12s. Clear it with this same workflow → action: clear." ;;
            clear) echo "::notice::Notice CLEARED. The banner disappears within ~12s." ;;
            *)     echo "::notice::Status read above. An empty result set means NO notice is showing." ;;
          esac
