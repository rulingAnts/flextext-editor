# ONE-SHOT: give a brand-new Worker its first real deployment. DELETE THIS FILE AFTERWARDS.
#
# WHY IT EXISTS. A Worker that has only ever received `wrangler versions upload` has no deployment,
# and therefore no routes: `workers_dev` and `preview_urls` from its wrangler.toml are applied by
# `wrangler deploy` and by nothing else. So its .workers.dev host 404s, its `staging-*` preview
# aliases 404, and its custom domain still serves whatever placeholder was there. Staging cannot
# bootstrap itself — the first deploy has to be a real one.
#
# ⚠ WHY NOT deploy-production.yml. That workflow deploys ALL SEVEN apps, by construction and on
# purpose: "a partial production deploy is not a smaller release, it is a broken one." That rule is
# right for a release and wrong for this, because this is not a release — it is the first wiring-up
# of a Worker nobody is using yet, and running the production workflow would ship the five apps
# field users depend on from a branch nobody has tested.
#
# ⚠ IT CANNOT REACH THOSE FIVE APPS. The list below is not an input. There is no free-text app
# field, no checkbox for the editor, the researcher, the recorder, the crowd embed or PAT, and no
# way to add one from the Run-workflow dialog — so the worst this can do is redeploy two apps that
# have no users. That containment IS the reason it is allowed to exist at all.
#
# HOW IT DIFFERS FROM STAGING: it passes WORKERS_CI_BRANCH=productionWeb, which is the single input
# deploy.sh routes on, so deploy.sh runs `wrangler deploy` rather than a preview upload. The code
# deployed is whatever ref you dispatch from (checkout takes the dispatched ref, not productionWeb).
#
# AFTER RUNNING IT: confirm the custom domain serves the app rather than "Hello world", then DELETE
# THIS FILE. Once these two apps join the normal production release there is no remaining use for
# it, and a workflow that can deploy to production outside the release path should not sit around
# waiting to be misread as the way to do things.
name: Bootstrap a new Worker (one-shot, delete after use)

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-apps.yml
    with:
      # Hard-coded, and only the two Workers that have never been deployed.
      apps: '["apps/consent","apps/segmenter"]'
      branch: productionWeb
    secrets: inherit
