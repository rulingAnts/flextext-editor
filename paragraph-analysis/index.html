<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flextext Paragraph Analysis Tool</title>
<meta name="description" content="Group the lines of an interlinear text into phrases, clauses, sentences, and paragraphs — semantic structure analysis over a .fxpa or .flextext file. Works offline.">
<meta name="theme-color" content="#5b3a9b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/paragraph.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/paragraph-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flextext Paragraph Analysis Tool">
<!-- Shared engine + styles live in the Flextext Editor's docs/ (same origin — on this
     Cloudflare site build.sh copies ../docs to /flextext-editor/, so the engine ships in the
     SAME atomic deployment as this shell; on the local dev rig dev-serve.sh maps both paths).
     All paragraph logic is maintained ONCE, in the editor repo's js/. -->
<link rel="stylesheet" href="/flextext-editor/css/app.css">
<!-- Selects paragraph-analysis mode in the shared engine. Classic inline script so it
     runs before the deferred module executes. -->
<script>window.__MODE = 'paragraph';</script>
</head>
<body>

<!-- STAGING/PREVIEW ribbon (same as the editor's): runtime hostname detection, so THIS SAME
     FILE ships to production unchanged — the ribbon can only ever appear on *.workers.dev
     preview hosts, never on pat.flextext.app. Inline — no engine dependency — so it shows even
     if app.js fails to load, which is exactly when knowing which site you are on matters most. -->
<script>
  if (/\.(pages|workers)\.dev$/.test(location.hostname)) {
    document.write('<div style="position:sticky;top:0;z-index:9999;background:repeating-linear-gradient(45deg,#b45309,#b45309 12px,#92400e 12px,#92400e 24px);color:#fff;text-align:center;font:600 13px/1.5 system-ui;padding:4px 8px;">STAGING — test site · situs uji — not production / bukan produksi</div>');
  }
</script>

<main id="pa-main">
<!-- The paragraph app renders everything here (shared js/app.js → initParagraphApp). -->
</main>

<div id="toast" hidden></div>

<!-- Shared app engine loads from the editor copy (same origin). -->
<script type="module" src="/flextext-editor/js/app.js"></script>
</body>
</html>
