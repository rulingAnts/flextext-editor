<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<title>Flextext Researcher</title>
<meta name="description" content="Set up and manage your coworkers' Flextext devices, send tasks, and review what they collect. Works offline.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="researcher.webmanifest">
<link rel="icon" href="icons/researcher.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/researcher-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flextext Researcher">
<!-- ⚠ LEGACY-ORIGIN REDIRECT (2026-08-17) — GitHub Pages only, and hostname-gated for a reason.
     THIS FILE SHIPS TO BOTH ESTATES. apps/researcher/build.sh copies this whole folder into the
     Cloudflare deployment (`cp -R ../../satellites/flextext-researcher/. public/`), so an
     unconditional redirect here would make https://research.flextext.app/ redirect to ITSELF —
     an infinite loop that breaks the researcher app for everyone. The hostname test is what keeps
     one file serving both, exactly like the STAGING ribbon below.
     Seth, 2026-08-17: "have the GitHub satellite for the researcher panel become an auto-redirect
     (with a link in case the auto-redirect doesn't work)… Ideally it silently redirects him so
     that he doesn't even notice."
     Scope: this path ONLY. The paired EDITOR app at /flextext-editor/ is a different scope with its
     own service worker and its own caches, and nothing here touches localStorage or IndexedDB —
     which the three PWAs share, being one origin. See sw.js for the cache-deletion rule. -->
<script>
  (function () {
    if (location.hostname !== 'rulingants.github.io') return;   // Cloudflare + dev rig: inert
    var target = 'https://research.flextext.app/' + location.search + location.hash;
    /* Written before the redirect fires so it is already on screen if navigation is blocked
       (extension, offline, popup-blocker oddity) — the "link in case it doesn't work". */
    document.write(
      '<div style="font:16px/1.6 system-ui;padding:24px;max-width:32em;margin:0 auto">'
      + '<p>The Researcher app has moved. Taking you there now\u2026</p>'
      + '<p>Aplikasi Peneliti telah dipindahkan. Mengalihkan Anda sekarang\u2026</p>'
      + '<p><a href="' + target + '">' + 'research.flextext.app' + '</a></p></div>');
    location.replace(target);
  })();
</script>
<!-- Shared engine + styles live in the Flextext Editor repo (same origin), so ALL
     researcher / connectivity logic is maintained ONCE. This app is a thin shell at a
     DISTINCT path (/flextext-researcher/) so it installs as its own PWA — the editor's
     root scope (/flextext-editor/) does NOT contain this path. -->
<link rel="stylesheet" href="/flextext-editor/css/app.css">
<!-- Selects researcher-console mode in the shared engine. Classic inline script so it
     runs before the deferred module executes. -->
<script>window.__MODE = 'researcher';</script>
</head>
<!-- ⚠ THE VERNACULAR TYPING POLICY, IN THE MARKUP. These four attributes INHERIT, so every
     field below is born with them: no script, no observer, no per-field writes, and in force
     from parse time — before any script runs and before an IME can attach. Autocorrect on a
     language no device has a dictionary for is silent data corruption; see js/typing.js and
     plans/typing-policy.md. The analysis-language fields override this at focus, one at a
     time, which is the only field a keyboard can rewrite anyway. -->
<body spellcheck="false" autocapitalize="none" autocorrect="off" writingsuggestions="false">
  <!-- STAGING ribbon — IDENTICAL to the editor's in docs/index.html, deliberately duplicated rather
       than shared: it is inline with no engine dependency, so it still shows when app.js fails to
       load, which is exactly when knowing which site you are on matters most. Runtime hostname
       detection, so this same file ships to production unchanged. -->
  <script>
    if (/\.(pages|workers)\.dev$/.test(location.hostname)) {
      document.write('<div id="fx-staging" style="position:sticky;top:0;z-index:9999;background:repeating-linear-gradient(45deg,#b45309,#b45309 12px,#92400e 12px,#92400e 24px);color:#fff;text-align:center;font:600 13px/1.5 system-ui;padding:4px 8px;">STAGING \u2014 test site \u00b7 situs uji \u2014 not production / bukan produksi</div>');
    }
  </script>


<main>

<div id="webkit-warning" class="banner warn-banner" hidden>
  <span data-i18n="webkit.warning"></span>
  <button class="banner-dismiss" data-dismiss="webkit-warning" title="✕">✕</button>
</div>
<div id="install-banner" class="banner install-banner" hidden>
  <span data-i18n="install.text"></span>
  <button id="btn-install" class="primary-btn" data-i18n="install.btn">Install app</button>
  <button class="banner-dismiss" data-dismiss="install-banner" title="✕">✕</button>
</div>

<!-- The researcher panel takes over this view with its own full-screen header.
     Rendered by the shared js/app.js (setupResearcherMode → initResearcherPanel).

     ⚠ THE BOOT SCREEN INSIDE IT IS WHAT A RESEARCHER SEES FIRST (Seth, 2026-10-04: "researcher PWA
     shows a blank screen until the app code is at least partially loaded"). The engine is ~2.5 MB of
     modules (app.js, i18n.js, researcher-panel.js and their imports), and until all of it has
     downloaded and run nothing else draws — on a slow link that is a long white page. This block is
     inline markup with its own inline style and a few lines of ES5, so it paints from the parse,
     before app.css or any module has arrived, and it still shows when the engine never loads.
     It needs no removal code: the panel's first render assigns root.innerHTML (sign-in, dashboard,
     every state), which replaces it. In the chosen language (the apps' saved choice, else the
     browser's, else English). After 20 s without the panel it says so and offers a reload. -->
<section id="view-researcher" class="view">
  <div id="fx-boot" role="status" aria-live="polite" style="box-sizing:border-box;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;text-align:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;color:#1a1d21">
    <svg width="64" height="64" viewBox="0 0 512 512" aria-hidden="true" style="border-radius:14px;flex:none"><rect width="512" height="512" rx="96" fill="#0f766e"/><g fill="#fff"><rect x="88" y="116" width="120" height="34" rx="10"/><rect x="232" y="116" width="76" height="34" rx="10"/><rect x="332" y="116" width="98" height="34" rx="10"/><g opacity=".62"><rect x="88" y="162" width="96" height="20" rx="8"/><rect x="232" y="162" width="60" height="20" rx="8"/><rect x="332" y="162" width="76" height="20" rx="8"/></g><rect x="88" y="244" width="84" height="34" rx="10"/><rect x="196" y="244" width="130" height="34" rx="10"/><rect x="350" y="244" width="74" height="34" rx="10"/><g opacity=".62"><rect x="88" y="290" width="64" height="20" rx="8"/><rect x="196" y="290" width="104" height="20" rx="8"/><rect x="350" y="290" width="58" height="20" rx="8"/></g><rect x="88" y="372" width="336" height="22" rx="9" opacity=".85"/></g></svg>
    <div style="font-size:19px;font-weight:600">Flextext Researcher</div>
    <div style="width:min(240px,70vw);height:4px;border-radius:2px;background:#dfe3e8;overflow:hidden" aria-hidden="true"><div id="fx-boot-bar" style="width:40%;height:100%;border-radius:2px;background:#0f766e"></div></div>
    <div id="fx-boot-text" style="color:#5b6470"><span lang="en">Loading the app…</span> <span lang="id">Memuat aplikasi…</span></div>
    <div id="fx-boot-slow" hidden style="max-width:30em;color:#5b6470;font-size:14px"></div>
  </div>
  <style>
    @keyframes fx-boot-slide { from { transform: translateX(-250%); } to { transform: translateX(350%); } }
    #fx-boot-bar { animation: fx-boot-slide 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { #fx-boot-bar { animation: none; width: 100%; opacity: .5; } }
    @media (prefers-color-scheme: dark) { #fx-boot { color: #e6e8eb; } #fx-boot-text, #fx-boot-slow { color: #a3a9b1; } }
  </style>
  <script>
    /* One language, the way the apps pick theirs: the choice saved under "flextext-lang", else the
       browser's preferred languages ("in" is the old code some Android versions report for
       Indonesian), else English. Plain ES5: this must run in a browser too old for the engine. */
    (function () {
      var LANGS = ['en', 'id'], lang = null, i, prefs, b;
      try { lang = localStorage.getItem('flextext-lang'); } catch (e) { lang = null; }
      if (LANGS.indexOf(lang) === -1) {
        lang = 'en';
        prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
        for (i = 0; i < prefs.length; i++) {
          b = String(prefs[i]).toLowerCase().split(/[-_]/)[0]; if (b === 'in') b = 'id';
          if (LANGS.indexOf(b) !== -1) { lang = b; break; }
        }
      }
      var text = document.getElementById('fx-boot-text'), spans = text.getElementsByTagName('span');
      for (i = 0; i < spans.length; i++) if (spans[i].getAttribute('lang') !== lang) spans[i].style.display = 'none';
      document.getElementById('fx-boot').setAttribute('lang', lang);
      /* Still here after 20 s: the engine has not rendered (slow link, or it failed). Say so, and
         offer a reload; if the panel has replaced this block meanwhile, the element is gone. */
      setTimeout(function () {
        var slow = document.getElementById('fx-boot-slow');
        if (!slow) return;
        /* Offline at this point means the connection dropped AFTER this page arrived: sw.js serves its
           own offline page only when the page itself cannot be fetched (navigations, network first,
           no cache), so that page and this screen never show for the same situation. */
        var offline = (typeof navigator.onLine === 'boolean') && !navigator.onLine;
        slow.textContent = offline
          ? (lang === 'id'
            ? 'Anda tampaknya sedang offline. Panel peneliti memerlukan koneksi internet. Periksa koneksi Anda, lalu muat ulang.'
            : 'You appear to be offline. The researcher panel needs an internet connection. Check your connection, then reload.')
          : (lang === 'id'
            ? 'Masih memuat. Pada koneksi lambat ini bisa memakan waktu. Jika tidak ada yang muncul, periksa koneksi Anda lalu muat ulang.'
            : 'Still loading. On a slow connection this can take a while. If nothing appears, check your connection and reload.');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = lang === 'id' ? 'Muat ulang' : 'Reload';
        btn.style.cssText = 'display:block;margin:10px auto 0;padding:8px 18px;font:inherit;border:1px solid #0f766e;border-radius:8px;background:#fff;color:#0f766e;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        slow.appendChild(btn);
        slow.hidden = false;
      }, 20000);
    })();
  </script>
</section>

</main>

<div id="toast" hidden></div>

<!-- Shared app engine loads from the editor repo (same origin). -->
<script type="module" src="/flextext-editor/js/app.js"></script>
</body>
</html>
