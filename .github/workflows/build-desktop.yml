# Build the Windows desktop shell.
#
# MANUAL ONLY — no push trigger and no schedule. This runs when someone asks for a build, because a
# build is only useful when a person is waiting to test it.
#
# COST: free. Actions on a PUBLIC repo with standard GitHub-hosted runners is always free, including
# windows-latest; the 2x Windows multiplier applies to BILLABLE (private-repo) minutes, which this is
# not. Standard runner only — no larger or GPU labels.
#
# ⚠ THE OUTPUT IS UNSIGNED. Windows SmartScreen will warn on first run ("Windows protected your PC")
# and the user must choose More info -> Run anyway. Code signing needs a paid certificate; until
# then that warning is expected, and anyone testing this needs to be told so in advance rather than
# discovering it and assuming the app is broken.

name: Build desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site the shell loads (blank = production)'
        required: false
        default: ''
      publish:
        description: 'Also attach the build to a PRE-RELEASE (stable, resumable download URL)'
        type: boolean
        required: false
        default: false
      devtools:
        description: 'TEST BUILD: allow Developer Tools. Leave OFF for anything a field user runs.'
        type: boolean
        required: false
        default: false

# contents: write is needed ONLY to attach the build to a release. Everything else here reads.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ffmpeg IS the capture engine on desktop — audio.js shells out to it. Bundling it is what
      # makes this a self-contained app rather than one that silently falls back to browser capture
      # on any machine that happens not to have ffmpeg installed. A field laptop never will.
      - name: Fetch ffmpeg for bundling
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in the downloaded archive' }
          New-Item -ItemType Directory -Force -Path electron/vendor | Out-Null
          Copy-Item $exe.FullName electron/vendor/ffmpeg.exe
          & electron/vendor/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      # Written into the packaged app; main.js reads it and treats missing/malformed as OFF, so a
      # release cannot gain developer tools by accident. Deliberately NOT defaulted to the branch or
      # anything implicit — someone has to ask for it.
      - name: Stamp the build flags
        shell: pwsh
        working-directory: electron
        run: |
          $dev = '${{ inputs.devtools }}' -eq 'true'
          @{ devTools = $dev } | ConvertTo-Json | Set-Content -Path src/build-flags.json
          Write-Host "devTools = $dev"
          Get-Content src/build-flags.json

      - name: Install
        working-directory: electron
        run: npm install

      - name: Build portable exe
        working-directory: electron
        env:
          FLEXTEXT_URL: ${{ github.event.inputs.url }}
        run: npm run dist:win

      # Prove the bundle actually contains what it needs, rather than trusting a green build. A
      # missing ffmpeg.exe produces a shell that opens, looks fine, and cannot record - the exact
      # failure that is invisible until someone is in a village trying to use it.
      - name: Verify the artifact
        shell: pwsh
        working-directory: electron
        run: |
          $exe = Get-ChildItem dist -Filter '*portable*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No portable exe was produced' }
          Write-Host ("built: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 40MB) { throw 'Artifact is implausibly small - Electron did not package' }
          $unpacked = Get-ChildItem dist -Directory -Filter '*unpacked*' | Select-Object -First 1
          if ($unpacked) {
            $ff = Join-Path $unpacked.FullName 'resources\ffmpeg.exe'
            if (-not (Test-Path $ff)) { throw 'ffmpeg.exe is NOT in resources - the app could not record' }
            Write-Host 'ffmpeg.exe present in resources'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: flextext-desktop-windows-x64
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # WHY A RELEASE AND NOT JUST THE ARTIFACT: an Actions artifact download URL is signed and
      # expires in about a minute, so it cannot be handed to a download manager — which is what a
      # slow, drop-prone connection actually needs. Release asset URLs are stable, need no
      # authentication, and resume. Publishing happens HERE, on GitHub's own network, so the 124 MB
      # never crosses the maintainer's link twice.
      #
      # PRE-RELEASE, not draft: a draft's assets still require authentication to fetch, which would
      # defeat the entire purpose. Pre-release is publicly downloadable AND clearly marked as not a
      # finished release.
      - name: Attach to a pre-release
        if: ${{ inputs.publish }}
        shell: pwsh
        working-directory: electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "desktop-v$ver-test"
          $exe = (Get-ChildItem dist -Filter '*portable*.exe' | Select-Object -First 1)
          # NOTE: built line by line, NOT with a PowerShell here-string. A here-string terminator
          # must sit at column 0, which cannot happen inside an indented YAML block - the same class
          # of trap that has broken this repo's workflows twice before.
          $notes = @(
            'Unsigned Windows x64 test build of the Flextext desktop shell.',
            '',
            '**This is a test build, not a release.** It exists so the Windows capture path can be',
            'tried on real hardware for the first time - dshow device enumeration and capture timing',
            'have never run outside CI.',
            '',
            '- **Portable**: no installer, no admin rights, nothing written to Program Files or the',
            '  registry. Uninstall by deleting the file.',
            '- **Unsigned**: Windows SmartScreen will warn on first run. Choose *More info -> Run',
            '  anyway*. Signing needs a paid certificate.',
            '- **ffmpeg is bundled** - it is the capture engine on desktop, invoked as a separate',
            '  process, so its GPL terms do not reach this app''s own code.',
            '- Loads the live site, so the editor engine updates itself; only the shell is fixed.'
          ) -join "`n"
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $exe.FullName --prerelease --title "Desktop shell $ver (Windows x64 test build)" --notes $notes
          # The canonical PUBLIC url - stable, unauthenticated, resumable. Not assets[0].url, which
          # is the API url and needs a token.
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
          Write-Host "DOWNLOAD_URL: $url"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Download`n`n<$url>"
