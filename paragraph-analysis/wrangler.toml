# The "paragraph-analysis-tool" Cloudflare Worker — the Paragraph Analysis satellite's site.
# Production: https://pat.flextext.app/ (custom domain) — built by Cloudflare's git-connected
# build from branch `productionWeb`, root directory `paragraph-analysis/`.
#
# ⚠ BRANCH ROUTING LIVES IN GIT, NOT THE DASHBOARD (Seth's rule: guarded in the workflow, not
# in memory). Point BOTH dashboard commands at the router:
#   Build command:  (none needed — the [build] hook below always runs)
#   Deploy command:              bash deploy.sh
#   Non-production ("Version") : bash deploy.sh
# deploy.sh checks release integrity, then: productionWeb → `wrangler deploy` (production);
# any other branch → `wrangler versions upload --preview-alias <branch>` (a PREVIEW version at
# https://<branch>-paragraph-analysis-tool.68mh29kgsd.workers.dev — production untouched).
# SAFETY NET: even if a dashboard command is ever reset to raw `npx wrangler deploy`, the
# [build] hook runs build.sh, which REFUSES to build a non-production branch outside deploy.sh
# — a misconfigured preview can never overwrite production.
#
# build.sh ASSEMBLES public/ — ../docs → public/flextext-editor (the shared engine, copied) +
# this shell → public/paragraph-analysis — so the engine ships in the SAME atomic deployment as
# the shell: this satellite has NO deploy-order hazard (a precached engine path can never 404).
#
# NOT the connectivity worker (worker/wrangler.toml) and NOT the staging site (root
# wrangler.toml). Static assets are free/unmetered on the Workers free plan; shell.js only
# redirects / and serves sw.js with no-store (the workers.dev CDN pinned a stale sw.js for the
# staging site on 2026-08-04 — same fix as staging-shell.js).
name = "paragraph-analysis-tool"
main = "shell.js"
compatibility_date = "2026-06-01"
workers_dev = true

[build]
# wrangler itself runs this before deploy/versions-upload, so the assembly (and the
# non-production guard inside it) is guaranteed regardless of dashboard build settings.
command = "bash build.sh"

[assets]
directory = "./public"
binding = "ASSETS"
# Route requests through shell.js BEFORE the asset fast-path, so the sw.js response it rewrites
# is never served from (or stored in) the CDN cache.
run_worker_first = true
