<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flextext Recorder moved</title>
<!-- The Flextext Recorder is now its OWN app at /text-recorder/ (a disjoint PWA
     scope, so it installs separately from the editor). This stub forwards any
     older /flextext-editor/record.html links there, preserving the query string.
     NOTE: deliberately NO <link rel="manifest"> here, so this bare URL is not
     associated with either PWA. -->
<meta name="robots" content="noindex">
<script>location.replace('../text-recorder/' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0;url=../text-recorder/">
</head>
<body>
<p>The Flextext Recorder has moved. <a href="../text-recorder/">Open the Flextext Recorder</a>.</p>
</body>
</html>
