name = "flextext-r2-worker"
main = "src/index.js"
compatibility_date = "2026-06-01"
# Keep the *.workers.dev URL live ALONGSIDE the custom domain (additive). wrangler 4
# DISABLES workers.dev by default once a custom_domain route exists — which breaks
# already-deployed field clients still pointed at …workers.dev. Must stay true until
# every client has cut over to connect.flextext.app.
workers_dev = true

# --- Workers Logs (observability) -------------------------------------------------
# WITHOUT THIS THE SECURITY LOG IS INVISIBLE. src/seclog.js writes structured events with
# console.log; console output is only RETAINED and searchable in the dashboard when
# observability is enabled. Workers created before ~late-2024 have it OFF by default, so
# declaring it here is what makes `"sec":1` events actually queryable (Workers & Pages →
# this worker → Logs, filter on `sec = 1`).
# Cost: Workers Logs is included in the free plan (daily event allowance, then sampling
# stops ingestion). It THROTTLES rather than bills, and with no payment method on file it
# cannot bill regardless — same safety valve as the rest of this account.
# head_sampling_rate = 1 keeps ALL requests; this worker's volume is tiny (a handful of
# researchers + field devices), and sampling a security log would defeat its purpose.
[observability]
enabled = true
head_sampling_rate = 1

# --- Custom domain (OAuth consent-screen branding) -------------------------------
# Puts the Worker behind connect.flextext.app IN ADDITION TO the default
# *.workers.dev URL (workers_dev stays unset = true), so already-deployed field
# clients keep working. `wrangler deploy` auto-provisions the proxied DNS record +
# edge cert for this hostname (the flextext.app zone is already in this CF account).
# The OAuth redirect_uri is derived from the request host (src/v1.js), so NO worker
# code change is needed — but BEFORE the client flips DEFAULT_WORKER to this domain,
# add https://connect.flextext.app/v1/oauth/google/callback to the Google OAuth
# client's Authorized redirect URIs (keep the workers.dev one during transition).
# Full ordered steps: docs/RELEASE-RUNBOOK.md.
[[routes]]
pattern = "connect.flextext.app"
custom_domain = true

# Bind YOUR OWN R2 bucket by name (no S3 keys needed/stored).
# Confirm the exact name with: wrangler r2 bucket list
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flextext-back-end"

[vars]
# Production: ONLY the live origin. Localhost dev origins live in .dev.vars (gitignored),
# which `wrangler dev` overlays — so the DEPLOYED worker never allowlists localhost.
# https://localhost is the ORIGIN OF THE ANDROID APKs, not a dev-machine loophole:
# Capacitor serves the bundled app from https://localhost (confirmed in logcat:
# "Loading app at https://localhost"), so without it every call from the native apps —
# enrollment, sync, upload, /drive downloads — fails CORS with origin_not_allowed.
# Kept as localhost rather than a custom server.hostname on Capacitor's own advice
# (localhost preserves secure-context Web APIs such as getUserMedia, which the engine
# still needs for the FLAC/lossy formats the native capture path does not handle).
# Exposure is small: CORS is browser-enforced and a site cannot forge an Origin header,
# so this only admits a page genuinely served from https://localhost on the user's own
# machine. The real gate remains the per-install secret.
# The workers.dev origin is Seth's own STAGING/dev site (git-connected static build of the
# `staging` branch). Allowing it lets a dev-site session enroll via a production invite link and
# sync as one of his "devices" — the real gate remains the per-install secret; CORS only admits
# pages genuinely served from his own staging origin.
# ⚠ EXACT STRING MATCH against the browser's Origin header (list.includes(origin), index.js /
# v1.js). An Origin is scheme://host[:port] and NEVER has a trailing slash — so "https://app
# .flextext.app/" would silently match nothing, and a bare "crowd.flextext.app" likewise. Every
# entry below is written exactly as a browser sends it.
#
# The four *.flextext.app origins are the Cloudflare-hosted apps (apps/ in this repo), which run
# ALONGSIDE the GitHub Pages estate rather than replacing it — both sets must be allowed while
# devices exist on both.
ALLOWED_ORIGINS = "https://rulingants.github.io,https://localhost,https://flextext-editor-dev.68mh29kgsd.workers.dev,https://app.flextext.app,https://record.flextext.app,https://research.flextext.app,https://crowd.flextext.app,https://staging-flextext-editor.68mh29kgsd.workers.dev,https://staging-flextext-recorder.68mh29kgsd.workers.dev,https://staging-flextext-researcher.68mh29kgsd.workers.dev,https://staging-flextext-crowd.68mh29kgsd.workers.dev,https://staging-paragraph-analysis-tool.68mh29kgsd.workers.dev,https://flextext-editor.68mh29kgsd.workers.dev,https://flextext-recorder.68mh29kgsd.workers.dev,https://flextext-researcher.68mh29kgsd.workers.dev,https://flextext-crowd.68mh29kgsd.workers.dev,https://paragraph-analysis-tool.68mh29kgsd.workers.dev"
MAX_FILE_BYTES  = "536870912"     # 512 MB per-file ceiling (Cloudflare cache limit)
MAX_TOTAL_BYTES = "9500000000"    # ~9.5 GB total — stops BEFORE the 10 GB free tier
# (RELAY_URL removed 2026-07-13: the Apps Script relay upload leg is retired —
# all uploads stream into the researcher's own Drive via their OAuth token.)

# RELAY_SECRET is a secret, NOT in this file. Set it after deploy with:
#   wrangler secret put RELAY_SECRET
# RELAY_WRITE_SECRET (owner-only: R2 uploads + /stats). NOT used by /v1 — researcher
# signup is open + rate-limited, so Seth is never a signup gatekeeper.
#   wrangler secret put RELAY_WRITE_SECRET

# --- Connectivity sync layer (/v1/*) — Phase 0. ---
# D1 created + schema applied + full /v1/ lifecycle verified on a staging worker
# against this DB (2026-06-20). The /v1/ block stays fault-isolated above the
# global gates, so it cannot affect /drive even if D1 is unreachable.
[[d1_databases]]
binding = "DB"
database_name = "flextext-connectivity"
database_id = "4b77babc-3581-4928-ab70-053660ba1b0d"

# Per-IP flood backstop for OPEN researcher self-signup (free Workers binding —
# no paid plan, no D1 writes). NOTE: Cloudflare's rate-limit binding is APPROXIMATE
# + eventually-consistent — it throttles a SUSTAINED flood, not precise per-minute
# counts (observed letting ~14 through at limit=2). That's acceptable: a stray
# signup is a harmless empty row, blast radius is self-contained, and D1-free
# throttles-not-bills. If precise control is ever needed, add a D1 per-IP counter.
[[unsafe.bindings]]
name = "SIGNUP_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# ============================================================================================
# STAGING ENVIRONMENT — deploy with:  wrangler deploy --env staging
# ============================================================================================
# Seth, 2026-08-11: "We need a dev worker that we can test before we push it to production, to
# make sure if we break it it doesn't break existing users any more than they already are."
#
# Until now the staging APPS talked to the PRODUCTION worker (their origins are in ALLOWED_ORIGINS
# above, and workerBase() returned DEFAULT_WORKER for every non-localhost host). So there was a
# staging tier for the editor and none at all for the backend: any worker change went straight to
# the deployment field devices depend on, and the only pre-production test was `wrangler dev` on
# the VM.
#
# ⚠ WRANGLER ENVIRONMENTS DO NOT INHERIT BINDINGS — BUT THEY DO INHERIT ROUTES (proven the hard
# way, 2026-08-11: the first `wrangler deploy --env staging` REASSIGNED the connect.flextext.app
# custom domain from the production worker to this one, taking /v1 sync and the Drive proxy away
# from every field device for ~20 minutes until worker-deploy.yml was re-run on productionWeb.
# wrangler prints a warning saying exactly this at deploy time — READ deploy warnings.)
# r2_buckets, d1_databases and vars are per-environment; everything NOT repeated below is simply
# absent here. That is deliberate and is the whole safety property:
#   - routes = []        → REQUIRED. Without it the top-level custom_domain route is
#                          INHERITED and a staging deploy hijacks connect.flextext.app.
#   - no [[r2_buckets]]  → staging CANNOT write to the production bucket (uploads 500 here)
#   - no [[d1_databases]]→ staging CANNOT read or write production accounts, devices or
#                          assignments. /v1/* returns 500 until a staging DB is bound (below).
# Do NOT "fix" those by copying the production bindings down. Point them at staging resources or
# leave them out; a staging worker holding production's R2 and D1 is not a staging worker.
#
# `caches.default` is keyed by request URL, and the URL's origin is this worker's own hostname, so
# the staging and production Drive caches are already separate with no extra work.
#
# SECRETS are per-environment too and are NOT in this file:
#   wrangler secret put RELAY_SECRET --env staging
# It must equal the client's DEFAULT_RELAY_TOKEN (app.js) or every /drive request 401s.
# RELAY_WRITE_SECRET can be left UNSET here: uploads are then disabled outright (403), which is
# the right posture for a test backend with no bucket.
#
# To test /v1 (researcher accounts, enrolment, assignments) on staging, create a SEPARATE database
# and bind it here — never the production one:
#   wrangler d1 create flextext-connectivity-staging
#   (paste the returned id below, then run the migrations against --env staging)
# Expect to re-create a researcher account and re-enrol a test device: that data is isolated by
# design, which is the point.
[env.staging]
name = "flextext-r2-worker-staging"
workers_dev = true
# Explicit empty routes: overrides the top-level [[routes]] custom_domain, which IS inherited by
# environments (see the 2026-08-11 incident note above). Never remove this line.
routes = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
# ONLY the staging app origins, the localhost dev rig, and every FEATURE-BRANCH PREVIEW ALIAS.
#
# Production origins are deliberately absent: if a field device ever reaches this worker, that is a
# misconfiguration and a CORS refusal is the loudest, safest way for it to surface. The `*-` star
# entries preserve that exactly — see originAllows() in src/v1.js: the leading `-` means
# `https://<branch>-flextext-editor.…` matches while PRODUCTION `https://flextext-editor.…` does
# not. They exist because deploy.sh publishes every non-production branch to
# `<branch>-<worker>.workers.dev`, and testing a major feature on its own preview estate (rather
# than on staging) is the standard workflow — so a new branch must not need a config edit here.
ALLOWED_ORIGINS = "https://localhost,https://staging-flextext-editor.68mh29kgsd.workers.dev,https://staging-flextext-recorder.68mh29kgsd.workers.dev,https://staging-flextext-researcher.68mh29kgsd.workers.dev,https://staging-flextext-crowd.68mh29kgsd.workers.dev,https://staging-paragraph-analysis-tool.68mh29kgsd.workers.dev,*-flextext-editor.68mh29kgsd.workers.dev,*-flextext-recorder.68mh29kgsd.workers.dev,*-flextext-researcher.68mh29kgsd.workers.dev,*-flextext-crowd.68mh29kgsd.workers.dev,*-paragraph-analysis-tool.68mh29kgsd.workers.dev"
MAX_FILE_BYTES  = "536870912"
MAX_TOTAL_BYTES = "9500000000"
# Tiny buffer ceiling ON STAGING ONLY, so ordinary test files exercise the big-file TEE cache path
# (production keeps the 24 MB default and hits the tee path only on genuinely big audio). If a
# tee-path bug exists, staging finds it with a 3 MB file instead of a field user with a 50 MB WAV.
# ⚠ This is a CACHING-PATH knob, not a size limit: MAX_FILE_BYTES (512 MB) is what bounds
# downloads, and both paths serve the whole file. It cannot cause a Drive download to fail.
DRIVE_CACHE_MAX_BYTES = "2097152"

# ⚠ TOML: every `key = value` above belongs to the [env.staging.vars] table it follows, so any new
# table header must come AFTER the last var. Adding one in the middle silently moves the vars below
# it into the wrong table.

# The STAGING database, created 2026-08-11 so /v1 (researcher accounts, enrolment, assignments) can
# be exercised here instead of only against production. It holds TEST accounts and devices only —
# expect to re-create a researcher account and re-enrol a test device; that isolation is the point.
# NEVER point this at `flextext-connectivity` (production).
# Schema applied with: d1 execute flextext-connectivity-staging --remote --file=schema.sql
[[env.staging.d1_databases]]
binding = "DB"
database_name = "flextext-connectivity-staging"
database_id = "95d4f1a1-e7c5-4eb0-a313-10eede8f7893"
