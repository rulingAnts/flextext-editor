# The "flextext-recorder" Cloudflare Worker — the Flextext Recorder at the ROOT of its own origin.
# Production: https://record.flextext.app/ — built by Cloudflare's git-connected build from branch
# `productionWeb`, root directory `apps/recorder/`.
#
# ⚠ BRANCH ROUTING LIVES IN GIT, NOT THE DASHBOARD (Seth's rule). Point BOTH dashboard commands
# at the router:
#   Deploy command:              bash deploy.sh
#   Non-production ("Version"):  bash deploy.sh
# productionWeb → `wrangler deploy`; any other branch → `wrangler versions upload
# --preview-alias <branch>`, which leaves production untouched.
#
# SAFETY NET: even if a dashboard command is reset to raw `npx wrangler deploy`, the [build] hook
# runs build.sh, which REFUSES to build a non-production branch outside deploy.sh.
#
# ⚠ THIS RUNS ALONGSIDE THE LEGACY GITHUB PAGES BUILD, it does not replace it. A new origin is a
# DIFFERENT PWA to the browser (identity is origin + scope + manifest id), so installed copies on
# rulingants.github.io keep working and keep updating from Pages. New invitations point here.
name = "flextext-recorder"
main = "shell.js"
compatibility_date = "2026-06-01"
# ⚠ workers_dev STAYS TRUE — deliberate (Seth, 2026-08-05). Each app therefore answers at BOTH its
# custom domain and <name>.68mh29kgsd.workers.dev, and both are listed in the connectivity worker's
# ALLOWED_ORIGINS so sign-in works at either. Turning it off was considered and rejected: the
# workers.dev host is a useful direct-to-Worker address that bypasses custom-domain DNS when
# diagnosing.
#
# ⚠ IF YOU EVER SET workers_dev = false, YOU MUST ALSO SET preview_urls = true EXPLICITLY.
# `preview_urls` DEFAULTS TO THE VALUE OF `workers_dev`, so flipping one silently switches off the
# staging-*.workers.dev preview aliases — the dev surface, as a side effect of tidying production.
# (workers_dev=false would remove only the workers.dev URL; custom domains are separate routing and
# are unaffected either way.)
workers_dev = true
preview_urls = true

[build]
command = "bash build.sh"

[assets]
directory = "./public"
binding = "ASSETS"
# Route through shell.js BEFORE the asset fast-path so sw.js is never served from the CDN cache.
run_worker_first = true
